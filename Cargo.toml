[package]
name = "keyboop"
version = "0.1.0"
edition = "2024"

[dependencies]
cpal = "0.18.2"
env_logger = "0.11.11"
ksni = { version = "0.3.7", default-features = false, features = ["blocking", "async-io"] }
libc = "0.2.191"
log = "0.4.35"
png = "0.18.1"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.1"
whisper-rs = { version = "0.16.0", features = ["log_backend", "openmp"] }
x11rb = { version = "0.14.0", features = ["xinput", "xkb", "xtest", "allow-unsafe-code"] }
xkbcommon = { version = "0.9.0", features = ["x11"] }

[profile.release]
lto = "thin"
